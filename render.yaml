services:
  - type: web
    name: stocksense-api
    env: python
    pythonVersion: "3.11.0"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: PYTHON_VERSION
        value: "3.11.0"